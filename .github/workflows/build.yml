name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip -o "FocusPhone(5).zip" -d .
          rm -f "FocusPhone(5).zip"
          if [ -d FocusPhone ] && [ -f FocusPhone/settings.gradle.kts ]; then
            mv FocusPhone/* .
            rm -rf FocusPhone
          elif [ -d FocusPhone/FocusPhone ] && [ -f FocusPhone/FocusPhone/settings.gradle.kts ]; then
            mv FocusPhone/FocusPhone/* .
            rm -rf FocusPhone
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.2
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusPhone-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk



